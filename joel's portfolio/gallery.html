<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<main class="container py-5">
  <h1 class="text-center mb-4">My Gallery</h1>

  <section class="card p-4 mb-5">
    <h2>My Motivation Video</h2>
    <p>
      In this video, I will explain why I chose to study
      Education with Geography and ICT.
    </p>

    <video class="w-100 rounded" controls>

    <p class="text-muted mt-2">
      My personal motivation for pursuing my degree.
    </p>
  </section>

  <section>
    <h2 class="mb-4">Photo Gallery</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <img src="images/profile.jpeg"

               alt="My profile photograph">

      <div class="col-md-4">
        <div class="card p-3 h-100">
          <img src="images/campus.jpeg"
               class="img-fluid rounded"
               alt="University campus">
          <p class="mt-3 mb-0">My University Life</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3 h-100">
          <img src="images/project.jpeg"
               class="img-fluid rounded"
               alt="My academic project">
